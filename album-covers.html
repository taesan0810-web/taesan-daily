<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TAESAN DAILY · 专辑封面核对</title>
  <style>
    body{font:15px system-ui,-apple-system,sans-serif;background:#faf6fc;color:#514664;margin:0}
    .wrap{max-width:960px;margin:auto;padding:22px 15px}h1{font-size:23px}
    .note{background:#eee8f6;padding:14px;border-radius:13px;line-height:1.7}
    .actions{position:sticky;top:0;background:#faf6fcee;padding:12px 0;display:flex;gap:8px;flex-wrap:wrap;z-index:5}
    button{border:0;background:#8d78b5;color:white;border-radius:9px;padding:11px 13px;font-size:14px;cursor:pointer}
    button:disabled{opacity:.45;cursor:default}.song{display:flex;gap:12px;border-bottom:1px solid #e6ddec;padding:12px 0;align-items:center}
    .song img{width:70px;height:70px;object-fit:cover;background:#eee;border-radius:8px}.info{flex:1;min-width:0}
    .info strong{display:block;overflow-wrap:anywhere}.info small{display:block;color:#776d81;margin:4px 0;overflow-wrap:anywhere}
    .info a{font-size:12px;color:#7660a2;margin-right:12px}.tag{font-size:12px;padding:3px 7px;border-radius:8px;background:#e8e2f0;display:inline-block;margin-top:4px}
    .ok{background:#d9f0e0}.warn{background:#ffe6c9}.skip{background:#f1e3e7}.song input{width:19px;height:19px}
    .sub{color:#776d81;font-size:12px}#status{margin:10px 0;font-weight:600}textarea{width:100%;height:180px;box-sizing:border-box}details{margin:16px 0}
  </style>
  <script src="./album-covers.js" defer></script>
</head>
<body><main class="wrap">
  <h1>🎧 TAESAN DAILY · 专辑封面核对</h1>
  <div class="note">已载入之前的 CSV 核对数据，保留已有封面与勾选状态。<b>自动查找只处理缺封面的歌曲</b>，参考 Spotify 专辑、歌手和发行版本；所有新增候选均需你核对后手动勾选。ISRC 和 Spotify 链接供逐项核对，Apple 搜索本身不能验证 ISRC。工具不登录、不直接写入 Supabase。</div>
  <div class="actions">
    <button id="go" disabled>① 仅查找缺失封面</button>
    <button id="stop" disabled>停止查找</button>
    <button id="sql" disabled>② 生成更新 SQL</button>
    <button id="csv" disabled>导出核对 CSV</button>
  </div>
  <div id="status" role="status" aria-live="polite">正在读取已有核对数据…</div>
  <p id="network" class="sub">连接失败不等于歌曲未收录。若出现网络、CORS、超时或限流错误，保留已有数据后停止，并在可访问音乐曲库的网络中重试。</p>
  <div id="list"></div>
  <details><summary>生成的 SQL（仅更新空封面）</summary><textarea id="output" aria-label="更新 SQL" readonly></textarea><button id="copy" disabled>复制 SQL</button></details>
</main></body>
</html>
