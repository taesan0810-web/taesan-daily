<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STAGE / TAESAN PERSONAL ARCHIVE</title><link rel="stylesheet" href="archive.css"><script src="preview-config.js"></script><script src="preview-guard.js"></script><script defer src="supabase-config.js"></script><script defer src="supabase-local.js"></script><script defer src="archive-nav.js"></script><script defer src="archive-records.js"></script><script src="workspace-mode.js"></script></head><body data-module="stage"><main class="archive-wrap"><header class="archive-heading"><a id="parent" href="work.html">← WORK</a><h1 id="moduleTitle">STAGE</h1><p id="moduleSubtitle">想法与公开文字</p></header><div class="archive-toolbar"><input id="search" type="search" aria-label="搜索档案" placeholder="搜索标题、文字、标签"><select id="category" aria-label="分类"></select><select id="sort" aria-label="排序"><option value="desc">日期 · 新到旧</option><option value="asc">日期 · 旧到新</option></select><button id="manage">管理档案</button></div><p id="status" role="status" aria-live="polite">正在读取档案…</p><section id="records" class="archive-list" aria-label="档案列表"></section><button id="more" hidden>加载更多</button><section id="editorPanel" class="archive-editor" hidden><div class="archive-toolbar"><h2>档案整理台</h2><button id="newRecord">新增档案</button><button id="export">导出备份</button><button id="logout" hidden>退出管理</button></div><form id="editor"><input id="recordId" type="hidden"><div class="archive-fields"><label class="full">标题<input id="title" maxlength="300" required></label><label>日期<input id="date" type="date"></label><label>分类<select id="editCategory"></select></label><label class="full">中文内容<textarea id="content" maxlength="50000"></textarea></label><label class="full" id="koreanLabel">韩文原文<textarea id="korean" lang="ko" maxlength="50000"></textarea></label><label id="eventLabel">演出名称<input id="event" maxlength="300"></label><label id="collaboratorsLabel">合作对象<input id="collaborators" maxlength="300"></label><label>来源名称<input id="source" maxlength="300"></label><label>来源链接<input id="sourceUrl" type="url" placeholder="https://"></label><label class="full">标签（逗号分隔）<input id="tags"></label><label class="full">封面图片 HTTPS 地址<input id="coverUrl" type="url" placeholder="https://"></label><label class="full">图片 HTTPS 地址（每行一张）<textarea id="imageUrls"></textarea></label><label class="full">上传图片<input id="files" type="file" multiple accept="image/jpeg,image/png,image/webp"></label><div id="uploadedImages" class="full archive-actions"></div><label class="full check"><input id="published" type="checkbox">公开发布</label></div><div class="archive-actions"><button class="primary" id="saveLocal" type="button">保存本机草稿</button><button id="saveCloud" type="submit">保存到云端</button><button id="cancel" type="button">取消编辑</button></div><p id="editStatus" role="status"></p></form></section><dialog id="login"><form id="loginForm"><h2>管理员登录</h2><label>邮箱<input id="email" type="email" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><p id="loginStatus" role="status"></p><div class="archive-actions"><button type="submit" class="primary">登录</button><button id="closeLogin" type="button">取消</button></div></form></dialog><footer class="archive-footer">TAESAN PERSONAL ARCHIVE / 非官方粉丝档案</footer></main></body></html>
