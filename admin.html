<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>管理 · 韩泰山档案</title>
    <link rel="stylesheet" href="archive.css" />
    <link rel="stylesheet" href="admin.css" />
    <script src="preview-config.js"></script>
    <script src="preview-guard.js"></script>
    <script defer src="supabase-config.js"></script>
    <script defer src="supabase-local.js"></script>
    <script defer src="admin.js"></script>
  </head>
  <body>
    <main class="admin-shell">
      <header class="admin-header">
        <div class="nav-start">
          <a
            id="returnToArchive"
            class="icon-link"
            href="daily.html"
            aria-label="返回档案"
            title="返回档案"
            ><span class="back-icon" aria-hidden="true"></span
          ></a>
          <h1>管理</h1>
        </div>
        <div class="admin-identity">
          <span id="identity" role="status"></span
          ><button id="openLogin" class="primary">登录</button>
          <details id="accountMenu" hidden>
            <summary aria-label="账号菜单" title="账号菜单">
              <span class="menu-icon" aria-hidden="true"></span>
            </summary>
            <button id="logout" hidden>退出登录</button>
          </details>
        </div>
      </header>
      <nav id="adminModules" aria-label="管理模块" hidden>
        <select id="modulePicker" aria-label="管理内容">
          <optgroup label="日常">
            <option value="daily">每日记录</option>
            <option value="journey">Journey 地点</option>
          </optgroup>
          <optgroup label="人物">
            <option value="tmi">TMI</option>
            <option value="thoughts">想法</option>
          </optgroup>
          <optgroup label="作品">
            <option value="music">音乐</option>
            <option value="stage">舞台</option>
            <option value="shorts">短视频</option>
          </optgroup>
        </select>
      </nav>
      <p id="workspaceStatus" role="status" aria-live="polite"></p>
      <section id="workspaceViews" aria-label="内容编辑" hidden></section>
      <dialog id="login">
        <form id="loginForm">
          <h2>登录</h2>
          <label
            >邮箱<input
              id="email"
              type="email"
              autocomplete="username"
              required /></label
          ><label
            >密码<input
              id="password"
              type="password"
              autocomplete="current-password"
              required
          /></label>
          <p id="loginStatus" role="alert"></p>
          <div class="archive-actions">
            <button class="primary" type="submit">登录</button
            ><button id="cancelLogin" type="button">返回</button>
          </div>
        </form>
      </dialog>
    </main>
  </body>
</html>
