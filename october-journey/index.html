.createElement('button');b.className='day'+(stats[d]?'':' missing');b.innerHTML=`<b>${d}</b><small>${places[placeFor(d)].label}</small>`;b.onclick=()=>{stop();render(d)};b.id='day'+d;timeline.appendChild(b)}function render(d){day=d;const p=placeFor(d),s=stats[d];document.querySelectorAll('.city').forEach(el=>{el.classList.toggle('current',el.id===p);el.querySelector('.bubble').innerHTML=el.id===p?(s?icons.map(([key,ico])=>`<div class="line"><span class="ico">${ico}</span><span>${s[key]}</span></div>`).join(''):'<div class="line">待更新</div>'):''});document.getElementById('date').textContent='10.'+String(d).padStart(2,'0');document.getElementById('location').textContent='📍 '+places[p].en;document.getElementById('numbers').innerHTML=icons.map(([key,ico,label])=>`<div class="num"><div class="symbol">${ico}</div><strong>${s?s[key]:'—'}</strong><small>${label}</small></div>`).join('');document.querySelectorAll('.day').forEach(b=>b.classList.toggle('active',b.id==='day'+d));document.getElementById('day'+d).scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});let plane=document.getElementById('plane');if(previousPlace!==p){plane.style.display='block';plane.style.left=places[previousPlace].x+'%';plane.style.top=places[previousPlace].y+'%';requestAnimationFrame(()=>requestAnimationFrame(()=>{plane.style.left=places[p].x+'%';plane.style.top=places[p].y+'%'}));setTimeout(()=>plane.style.display='none',1150)}else plane.style.display='none';previousPlace=p}function stop(){clearInterval(timer);timer=null;document.getElementById('play').textContent='▶ 自动播放'}function play(){stop();document.getElementById('play').textContent='Ⅱ 暂停播放';timer=setInterval(()=>{if(day>=31){stop();return}render(day+1)},1800)}document.getElementById('play').onclick=()=>timer?stop():play();document.getElementById('prev').onclick=()=>{stop();render(Math.max(1,day-1))};document.getElementById('next').onclick=()=>{stop();render(Math.min(31,day+1))};render(1);setTimeout(play,1200);
