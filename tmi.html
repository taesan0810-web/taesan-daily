<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8e8f0"><title>TAESAN TMI · 关于韩泰山的细碎记录</title><link rel="stylesheet" href="tmi.css"><script src="supabase-config.js"></script><script defer src="supabase-local.js"></script><script defer src="tmi.js"></script></head>
<body><main class="wrap"><header><a class="back" href="index.html">← TAESAN DAILY · 营业日历</a><button id="manage">✎ 管理档案</button></header>
<section class="hero"><p class="eyebrow">TAESAN DAILY / PERSONAL ARCHIVE</p><h1>TAESAN TMI</h1></section>
<section class="filters" aria-label="档案筛选"><label class="search">关键词<input id="search" type="search" placeholder="搜索中文、韩文、标题或标签"></label><div class="filterrow"><label>分类<select id="category"><option value="">全部分类</option></select></label><label>童年 · 出道前<select id="stage"><option value="">全部时期</option><option value="all">全部出道前档案</option><option>上学前</option><option>小学</option><option>中学</option><option>未明确</option></select></label><label>排序<select id="sort"><option value="desc">公开日期 · 从新到旧</option><option value="asc">公开日期 · 从旧到新</option></select></label><label id="visibilityLabel" hidden>状态<select id="visibility"><option value="published">已发布</option><option value="all">全部（含草稿）</option><option value="draft">仅草稿</option></select></label></div></section>
<p id="status" role="status" aria-live="polite">正在连接档案馆……</p><div id="cards" class="cards"></div><button id="more" class="more" hidden>加载更多</button>
<section id="admin" class="admin panel" hidden><div class="sectionhead"><h2>档案整理台</h2><button id="logout">退出管理</button></div><p id="identity" class="muted"></p><div class="actions"><button id="new">＋ 新档案</button><button id="export">导出完整 TMI 备份</button></div>
<form id="editor"><input id="recordId" type="hidden"><div class="fields"><label class="full">标题（可选）<input id="title" maxlength="300"></label><label class="full">中文内容 *<textarea id="content" required maxlength="50000" rows="6"></textarea></label><label>韩文原文<textarea id="korean" rows="4" lang="ko"></textarea></label><label>中文翻译<textarea id="translation" rows="4"></textarea></label><label>分类<select id="editCategory"></select></label><label>童年 · 出道前学段<select id="editStage"><option value="">不属于出道前档案</option><option>上学前</option><option>小学</option><option>中学</option><option>未明确</option></select></label><label class="full">标签（逗号分隔）<input id="tags" placeholder="例如：初中，练习生，音乐"></label><label>公开日期（不明确留空）<input id="date" type="date" min="1900-01-01" max="2100-12-31"></label><label>信息来源<input id="source" placeholder="采访 / 直播 / DM / 用户提供资料"></label><label class="full">原始来源链接<input id="url" type="url" placeholder="https://"></label><label class="full">来源说明<textarea id="note" rows="2" placeholder="可注明文档页码、待核实事项"></textarea></label><label class="full">图片（JPG / PNG / WebP，每张最多5MB）<input id="files" type="file" multiple accept="image/jpeg,image/png,image/webp"></label></div><p class="muted">DM 仅录入自己整理的摘要，不上传付费原文、翻译或图片。移除图片只解除记录引用，不立即删除备份文件。</p><div id="previews" class="previews"></div><label class="check"><input id="published" type="checkbox">公开发布（未勾选则保存为草稿）</label><div class="actions"><button class="primary" id="save" type="submit">保存档案</button><button id="reset" type="button">取消编辑</button></div><p id="editStatus" role="status"></p></form>
<details class="panel"><summary>新增分类</summary><div class="actions"><input id="newCategory" maxlength="60" placeholder="分类名称" aria-label="新分类名称"><button id="addCategory">添加分类</button></div></details>
<details class="panel"><summary>批量导入 JSON</summary><p class="muted">先预览检查，再确认写入。已有 ID 不会被覆盖，成功项不会重复导入。</p><a href="tmi-import-example.json" download>下载 JSON 示例</a><input id="importFile" type="file" accept="application/json,.json"><div id="importPreview"></div><div class="actions"><button id="confirmImport" disabled>确认导入有效记录</button><button id="cancelImport">取消导入</button></div></details></section>
<dialog id="login"><form id="loginForm"><h2>登录档案整理台</h2><p class="muted">与 TAESAN DAILY 使用同一管理员账号。</p><label>邮箱<input id="email" type="email" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><p id="loginStatus" role="status"></p><div class="actions"><button type="submit" class="primary">登录</button><button type="button" id="closeLogin">取消</button></div></form></dialog>
<dialog id="lightbox"><button id="closeImage" aria-label="关闭图片">关闭 ×</button><img id="largeImage" alt="档案图片放大"></dialog></main></body></html>
